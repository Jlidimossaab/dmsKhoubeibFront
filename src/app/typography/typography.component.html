<div class="main-content">
    <div class="container-fluid">
      <div class="card">
        <div class="card-header card-header-danger d-flex justify-content-between align-items-center">
          <h4 class="card-title">Document Management</h4>
          <div class="input-group" style="width: 300px;">
            <div class="input-group-prepend">
              <span class="input-group-text" id="search-addon">
                <i class="material-icons">search</i>
              </span>
            </div>
            <input
              type="text"
              placeholder="Filter by name..."
              [(ngModel)]="filterTerm"
              (ngModelChange)="filterTree()"
              class="form-control"
              aria-label="Filter"
              aria-describedby="search-addon"
            />
          </div>
        </div>
        <div class="card-body">
          <div id="typography">
            <div class="row">
              <app-tree-docs [data]="data"></app-tree-docs>
            </div>
          </div>
        </div>
      </div>
      <button class="btn btn-primary" (click)="uploadDocuments()">Submit Changes</button>
    </div>
  </div>
